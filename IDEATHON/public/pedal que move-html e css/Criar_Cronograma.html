	<body>
		<div class = "conta"> </div>
		<div class = "menubackground"> <!--depois vejo como colocar cada um desses botões como REAIS botões-->
			<div class = "menuselected"> criar cronograma </div>
			<a href= "passeios programados.php">
				<div class = "menuoptions"> verificar passeios </div>
			</a>

		<div class = "conteudo-conteiner"> 
			<div class = "conteudo-title">CRIAR CRONOGRAMA</div>
			<div class = "conteudo">
				<div class = "mapa" id="map"> </div> <!--div de colocar o mapa com o trajetório no google maps. pegar url do trajeto para banco de dados-->
					<!--A partir daqui começa as mudanças para o back-end, @Augusto-->
				<form class="conteudo-escrito" id="form-pedal" onsubmit="event.preventDefault();">
					<div class="formulario-painel">

						<div class="campo_main">
						<div class="grupo-forms">
							<label for="nome_pedal">Nome do Passeio</label>
							<input type="text" id="nome_pedal" placeholder="Ex: Pedalada Noturna no Centro" required>
						</div>

						<div class ="grupo-forms">
							<label for="ponto_partida">Ponto de Partida</label>
							<input type="text" id="ponto_partida" placeholder="Ex: Praça Central, ao lado do BB" required>
						</div>

							  <div class="grupo-forms">
                <label for="ponto_final">Fim do Pedal</label>
                <input type="text" id="ponto_final" placeholder="Ex: Drogaria Farmais" required>
            </div>

						
						<div class="grupo-forms">
						 <label for="descricao_Passeio">Descrição/Recados</label>
						 <input type="text" id="descricao_pedal" placeholder="Ex: tragam água, Bom para iniciantes">

						<div class="bloco-tempo">

							<div class="grupo-forms">

							<div class="grupo-forms">

								<input type="number" step="0.01" id="Km" required>
							</div>
						</div>
					</div>
				
					<input type="hidden" id="rota_coordenadas">
					
					<!-- Botão centralizado na parte inferior -->

				 <!--Fim do meu front-end (@Augusto)-->
			</div>
		</div>
		<script>
		document.getElementById('form-pedal').addEventListener('submit', async (e) => {
			e.preventDefault();
			const dados = {
				NameRide: document.getElementById('nome_pedal').value,
				LocIni: document.getElementById('ponto_partida').value,
				LocEnd: document.getElementById('ponto_final').value,
				DataDate: document.getElementById('data_pedal').value,
				DataHour: document.getElementById('hora_pedal').value,
				DataKm: parseFloat(document.getElementById('Km').value)
			};

			try {
				const callingAPI_insert = await fetch ('/api/insertingInto', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json',
					'ngrok-skip-browser-warning': 'true'
				},
				body:JSON.stringify(dados)
				});
				if(!callingAPI_insert.ok)  throw new Error ('Erro na Comunicação!');

				const resposta = await callingAPI_insert.json();
				alert('GRAVADO COM SUCESSO!');
				document.getElementById('form-pedal').reset();
			} 
			 catch(erro) {
			 	console.error('Submit falhou..:',erro);
			 }
		});
		</script>
		<script>
 		const mapa = L.map('map').setView([-21.2089, -50.4408], 13);

L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
}).addTo(mapa);

mapa.whenReady(function() {
    setTimeout(() => {
        mapa.invalidateSize();
    }, 250);
});


let quilometragemTotal = 0;
let nomeDaRota = "";


const routingControl = L.Routing.control({
    waypoints: [], 
    routeWhileDragging: false,
    show: false, 
    createMarker: function(i, wp, nWps) {
       
        return L.marker(wp.latLng);
    },
    lineOptions: {
        styles: [{ color: '#438d7d', opacity: 0.8, weight: 5 }]
    }
}).addTo(mapa);


routingControl.on('routesfound', function(e) {
    const routes = e.routes;
    const rotaPrincipal = routes[0];


    quilometragemTotal = rotaPrincipal.summary.totalDistance / 1000;

    document.getElementById('Km').value = quilometragemTotal.toFixed(2); //Eu ESCREVI ESSE DAQUI :)
    

    nomeDaRota = rotaPrincipal.name || "Rota Personalizada??"; //(eu não faço a menor ideia do que isso faz, eu só copiei de um video BR...)


			if(nomeDaRota && nomeDaRota !== "Rota Personalizada??") 
			{
				const montanteDeRuas = nomeDaRota.split(',').map(rua => rua.trim());

				if (montanteDeRuas.length > 0) {
					document.getElementById('ponto_partida').value = montanteDeRuas[0];

					if(montanteDeRuas.length > 1) {
						document.getElementById('ponto_final').value = montanteDeRuas[montanteDeRuas.length -1];
					} else {
						document.getElementById('ponto_final'.value = montanteDeRuas[0]);
					}
				}
			}

    const coordenadasReais = rotaPrincipal.coordinates.map(p => [p.lat, p.lng]);


    document.getElementById('rota_coordenadas').value = JSON.stringify(coordenadasReais);

    console.log("=== Nova Rota Calculada por Ruas ===");
    console.log("Nome da Rota.........: ", nomeDaRota);
    console.log("Distância Real (KM)...: ", quilometragemTotal.toFixed(2) + " km");
});


mapa.on('click', function (evento) {
    const latlng = evento.latlng;


    const waypointsAtuais = routingControl.getWaypoints();
    

    const pontosFiltrados = waypointsAtuais.filter(wp => wp.latLng !== null).map(wp => wp.latLng);
    

    pontosFiltrados.push(latlng);


    routingControl.setWaypoints(pontosFiltrados);
});
		</script>
	</body>
