<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar pedal</title>

  <!-- Mapbox GL JS: biblioteca e estilos oficiais -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.33.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.33.0/mapbox-gl.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --verde-escuro: #355344;
      --verde: #438d7d;
      --verde-claro: #eaf8f3;
      --texto: #17211d;
      --cinza: #6b7771;
    }

    body {
      min-height: 100vh;
      background: var(--verde-claro);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    .pagina {
      min-height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .barra-lateral {
      width: 110px;
      min-height: 100vh;
      background: var(--verde-escuro);
      border-radius: 0 22px 22px 0;
      flex-shrink: 0;
    }

    .conteudo {
      width: min(850px, calc(100% - 64px));
      margin: 0 auto;
      padding: 70px 20px 55px;
    }

    h1 {
      margin-bottom: 9px;
      font-size: clamp(28px, 4vw, 40px);
      letter-spacing: -1px;
    }

    .subtitulo {
      margin-bottom: 24px;
      color: var(--cinza);
      font-size: 15px;
      line-height: 1.5;
    }

    .mapa {
      height: 330px;
      position: relative;
      overflow: hidden;
      border: 3px solid var(--verde-escuro);
      border-radius: 34px;
      background: #e5ece8;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Mantém os controles do mapa alinhados com o visual da página. */
    .mapboxgl-ctrl-group {
      overflow: hidden;
      border-radius: 12px !important;
      box-shadow: 0 2px 9px #17211d26 !important;
    }

    .aviso-mapa {
      position: absolute;
      z-index: 2;
      left: 14px;
      bottom: 14px;
      max-width: calc(100% - 28px);
      padding: 9px 13px;
      border: 1px solid #ffffffb8;
      border-radius: 10px;
      background: #ffffffed;
      color: #52635a;
      font-size: 13px;
      line-height: 1.4;
      box-shadow: 0 2px 8px #17211d18;
      pointer-events: none;
    }

    .status-mapa {
      margin-top: 7px;
      color: var(--cinza);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .status-mapa.erro {
      color: #a33b32;
      font-weight: 600;
    }

    .local-selecionado {
      min-height: 25px;
      margin-top: 12px;
      color: var(--cinza);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .local-selecionado strong {
      color: var(--verde-escuro);
    }

    .formulario {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-top: 26px;
    }

    .campos {
      display: flex;
      flex: 1;
      gap: 20px;
    }

    .campo {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 9px;
    }

    .campo label {
      font-size: 17px;
      font-weight: 700;
    }

    .campo input {
      width: 100%;
      min-height: 49px;
      padding: 10px 12px;
      border: 2px solid #b7cec3;
      border-radius: 12px;
      background: #fff;
      color: var(--texto);
      font: inherit;
    }

    .campo input:focus {
      outline: 3px solid #438d7d40;
      border-color: var(--verde);
    }

    .botao {
      min-height: 54px;
      padding: 0 27px;
      border: 0;
      border-radius: 30px;
      background: linear-gradient(100deg, #4ba58d, #39848b);
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .botao:hover {
      filter: brightness(1.06);
    }

    @media (max-width: 700px) {
      .barra-lateral {
        width: 22px;
        border-radius: 0 12px 12px 0;
      }

      .conteudo {
        width: calc(100% - 38px);
        padding: 42px 10px;
      }

      .mapa {
        height: 280px;
        border-radius: 24px;
      }

      .formulario,
      .campos {
        flex-direction: column;
        align-items: stretch;
      }

      .formulario {
        gap: 20px;
      }

      .campos {
        gap: 16px;
      }

      .botao {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="pagina">
    <aside class="barra-lateral" aria-hidden="true"></aside>

    <main class="conteudo">
      <h1>Agendar pedal</h1>
      <p class="subtitulo">Escolha o ponto de encontro, a data e o horário do seu próximo pedal.</p>

      <section class="mapa" aria-label="Mapa interativo para escolher o ponto de encontro">
        <div id="map"></div>
        <div class="aviso-mapa" id="aviso-mapa">Clique no mapa para marcar o ponto de encontro. Você também pode arrastar o marcador.</div>
      </section>

      <p class="status-mapa" id="status-mapa" role="status" aria-live="polite">
        Carregando o mapa do Mapbox...
      </p>

      <p class="local-selecionado" id="local-selecionado" aria-live="polite">
        <strong>Ponto de encontro:</strong> ainda não selecionado.
      </p>

      <form class="formulario">
        <div class="campos">
          <div class="campo">
            <label for="data">Data</label>
            <input type="date" id="data" name="data" required>
          </div>

          <div class="campo">
            <label for="hora">Horário</label>
            <input type="time" id="hora" name="hora" required>
          </div>
        </div>

        <!-- Estes campos guardam as coordenadas selecionadas para uma futura integração com o cadastro. -->
        <input type="hidden" id="latitude" name="latitude">
        <input type="hidden" id="longitude" name="longitude">

        <button class="botao" type="button">Criar pedal</button>
      </form>
    </main>
  </div>

  <script>
    // Token público do Mapbox (pk). Restrinja os domínios autorizados no painel da sua conta.
    mapboxgl.accessToken = 'pk.eyJ1IjoiaHVuZ3JpYXppbiIsImEiOiJjbXczanY1Nm8wMGZsMzVxNDE1YWl1dWo2In0.RgTWXP-Q-Fod8BotoF3T3A';

    // O mapa abre sobre Araçatuba. Não solicita nem acessa a localização do dispositivo.
    const mapa = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [-50.4408, -21.2089],
      zoom: 13
    });

    mapa.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');

    let marcador = null;

    const campoLatitude = document.getElementById('latitude');
    const campoLongitude = document.getElementById('longitude');
    const textoLocal = document.getElementById('local-selecionado');
    const avisoMapa = document.getElementById('aviso-mapa');
    const statusMapa = document.getElementById('status-mapa');
    let mapaCarregado = false;

    function mostrarErroMapa(erro) {
      const mensagem = erro && erro.message ? erro.message : String(erro || 'Erro desconhecido');
      console.error('Erro do Mapbox:', erro);
      statusMapa.classList.add('erro');

      if (/token|unauthorized|forbidden|401|403/i.test(mensagem)) {
        statusMapa.textContent = 'Falha de autorização do Mapbox. Confira se o token está ativo, tem permissão styles:read e permite o endereço usado para abrir esta página.';
      } else if (/webgl|context/i.test(mensagem)) {
        statusMapa.textContent = 'Falha de WebGL. Ative a aceleração gráfica do navegador e reinicie-o. Detalhe: ' + mensagem;
      } else {
        statusMapa.textContent = 'O Mapbox encontrou um erro ao carregar o mapa: ' + mensagem;
      }
    }

    function atualizarPonto() {
      const coordenadas = marcador.getLngLat();
      const longitude = coordenadas.lng.toFixed(6);
      const latitude = coordenadas.lat.toFixed(6);

      campoLatitude.value = latitude;
      campoLongitude.value = longitude;
      textoLocal.innerHTML = '<strong>Ponto de encontro:</strong> ' + latitude + ', ' + longitude;
      avisoMapa.textContent = 'Ponto marcado! Clique em outro lugar ou arraste o marcador para ajustar.';
    }

    mapa.on('click', function (evento) {
      if (!marcador) {
        marcador = new mapboxgl.Marker({ color: '#438d7d', draggable: true })
          .setLngLat(evento.lngLat)
          .addTo(mapa);

        marcador.on('dragend', atualizarPonto);
      } else {
        marcador.setLngLat(evento.lngLat);
      }

      atualizarPonto();
    });

    mapa.on('load', function () {
      mapaCarregado = true;
      statusMapa.classList.remove('erro');
      statusMapa.textContent = 'Mapa carregado. Clique para escolher o ponto de encontro.';
      avisoMapa.textContent = 'Clique no mapa para marcar o ponto de encontro. Você também pode arrastar o marcador.';
    });

    mapa.on('error', function (evento) {
      // O Mapbox pode emitir erros individuais de fonte/tiles mesmo após carregar o estilo.
      mostrarErroMapa(evento && evento.error ? evento.error : evento);
    });

    // Ajuda a identificar falhas em que o estilo nunca termina de carregar.
    window.setTimeout(function () {
      if (!mapaCarregado && !statusMapa.classList.contains('erro')) {
        statusMapa.classList.add('erro');
        statusMapa.textContent = 'O mapa ainda não carregou. Verifique o token/restrições de URL, a conexão e o suporte a WebGL2. Abra o Console do navegador (F12) para ver o erro detalhado.';
      }
    }, 12000);
  </script>
</body>
</html>
